<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tayem Chess</title>
<style>
:root{--light:#fbf3f1;--dark:#c0392b;--bg:#f6efed;--fg:#241a19;--card:#fff;--line:#e3cfcb;--sel:#f4d03f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1514;--fg:#f4e9e7;--card:#2b1e1c;--line:#4a3532}}
:root[data-theme="dark"]{--bg:#1d1514;--fg:#f4e9e7;--card:#2b1e1c;--line:#4a3532}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:12px;max-width:520px;margin-inline:auto}
h1{font-size:1.25rem;margin:4px 0 10px;color:var(--dark)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:var(--dark);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--fg);border:1px solid var(--line)}
.big{width:100%;padding:12px;font-weight:700}
.me{font-weight:700;color:var(--dark)}
#st{font-weight:700;text-align:center;margin:6px 0}
#bd{direction:ltr;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;border:3px solid var(--dark);border-radius:6px;overflow:hidden;user-select:none}
.sq{min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:min(10vw,50px);line-height:1;position:relative;cursor:pointer}
.l{background:var(--light)}.d{background:var(--dark)}
.sq.sel{background:var(--sel)}.sq.last{box-shadow:inset 0 0 0 100px rgba(244,208,63,.4)}.sq.chk{background:#ff2d2d}
.sq.mv::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(30,30,30,.4)}
.sq.cp::after{width:88%;height:88%;background:none;border:4px solid rgba(30,30,30,.45)}
.w{color:#fff;-webkit-text-stroke:1.2px #111;text-shadow:0 0 2px #000,0 0 2px #000}.b{color:#1a1a1a;text-shadow:0 0 1px #fff}
.bar{display:flex;gap:8px;margin-top:10px;justify-content:center}
.muted{opacity:.7;font-size:.9rem}
.wrap{position:relative;direction:ltr}.wrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bar{flex-wrap:wrap}.tg.on{background:var(--dark);color:#fff;border-color:var(--dark)}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
:root:root:root{--bg:#1b1312;--fg:#f3e9e7;--card:#2a1f1d;--line:#3d2d2a;--acc:#e0483a}
body{padding:0 0 150px;max-width:none;margin:0}
h1,body>.muted{display:none}
#v{direction:ltr;padding:10px 12px;max-width:520px;margin-inline:auto}
.scr{animation:sl .28s ease both}
@keyframes sl{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pp{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
@keyframes dr{from{opacity:0;transform:translateY(-44px) scale(1.4)}to{opacity:1;transform:none}}
@keyframes sf{to{opacity:0;visibility:hidden}}
#splash{position:fixed;inset:0;background:#150e0d;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;animation:sf .5s ease 1.4s both}
#splash b{font-size:80px;color:var(--acc);animation:pp .9s cubic-bezier(.2,1.4,.4,1) both}
#splash span{font-weight:800;font-size:1.5rem;letter-spacing:1px;animation:fi .8s ease .4s both}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 10px}.top b{font-size:1.15rem}
.ava{width:40px;height:40px;border-radius:8px;background:#e8dcd9;color:#333;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.sp{flex:1}.chip{background:var(--card);border-radius:20px;padding:6px 12px;font-weight:700}
.cards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.qc{flex:0 0 120px;height:110px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;cursor:pointer;text-align:center}
.qc i{font-style:normal;font-size:30px}.qc b{font-size:1.4rem}
.sec{font-weight:800;margin:16px 0 8px}
.hr{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.hr.on{background:var(--card);border-radius:10px}
.badge{min-width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.win{background:#3fa34d}.loss{background:#d64545}.draw{background:#888}
.lbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);padding:16px;border-radius:12px;font-size:1.05rem;font-weight:700;margin-bottom:10px}
.lbtn.start,.big.start{background:var(--acc);color:#fff;border:0;border-bottom:4px solid #8e2a20;font-size:1.25rem;padding:16px}
.hero{font-size:84px;text-align:center;color:var(--acc);margin:4px 0 12px}
.ic{width:30px;text-align:center;font-size:1.3rem}
#nav{position:fixed;left:0;right:0;bottom:0;direction:ltr;display:flex;justify-content:space-around;background:#150e0d;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:20}
#nav button{background:none;color:#a99;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;padding:2px 10px}
#nav button.on{color:#fff}#nav i{font-style:normal;font-size:1.35rem}
#pb{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;z-index:21}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;direction:ltr}
.sh{background:var(--card);width:100%;max-width:520px;margin:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s ease both;max-height:85vh;overflow:auto}
.tcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.pl{display:flex;align-items:center;gap:10px;padding:6px 2px}
.ck{margin-left:auto;background:#150e0d;padding:6px 12px;border-radius:6px;font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}.ck.on{background:#fff;color:#111}
.gb{display:flex;justify-content:space-around;margin-top:14px}
.gb button{background:none;color:#d9c7c4;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}.gb i{font-style:normal;font-size:1.5rem}
#bd{touch-action:none}
.sq span.lift{opacity:.25}
.enter{animation:pop .5s cubic-bezier(.2,1.2,.4,1) both}
.enter .sq span{animation:dr .55s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--k)*9ms + 150ms)}
.ghost{position:fixed;pointer-events:none;z-index:99;display:flex;align-items:center;justify-content:center;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.5))}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:20px;font-weight:700;z-index:100;animation:fi .25s both}
</style>
</head>
<body>
<h1>♞ Tayem Chess <small class="muted">· Chess EG</small></h1>
<div id="v"><div class="card">جاري التحميل...</div></div>
<div class="muted" style="text-align:center;margin:6px 0 20px">© Tayem Chess · Chess EG</div>
<script>
const G={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},V={p:100,n:320,b:330,r:500,q:900,k:0};
const wh=p=>p===p.toUpperCase();
const N=[-17,-15,-10,-6,6,10,15,17],KG=[-9,-8,-7,-1,1,7,8,9];
const ok=(i,j)=>j>=0&&j<64&&Math.abs((i&7)-(j&7))<=2;
const START='rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR';
const D=[[1,0],[-1,0],[0,1],[0,-1]],X=[[1,1],[1,-1],[-1,1],[-1,-1]];
function ray(b,i,dirs,side,out){for(const[dr,dc]of dirs){let r=(i>>3)+dr,c=(i&7)+dc;while(r>=0&&r<8&&c>=0&&c<8){const j=r*8+c,q=b[j];if(!q)out.push(j);else{if(wh(q)!==side)out.push(j);break}r+=dr;c+=dc}}}
function attacked(b,sq,by){const r=sq>>3,c=sq&7,pr=by?r+1:r-1;
 for(const dc of[-1,1]){const cc=c+dc;if(pr>=0&&pr<8&&cc>=0&&cc<8){const q=b[pr*8+cc];if(q&&q.toLowerCase()==='p'&&wh(q)===by)return true}}
 for(const o of N){const j=sq+o;if(ok(sq,j)){const q=b[j];if(q&&q.toLowerCase()==='n'&&wh(q)===by)return true}}
 for(const o of KG){const j=sq+o;if(j>=0&&j<64&&Math.abs((j&7)-c)<=1){const q=b[j];if(q&&q.toLowerCase()==='k'&&wh(q)===by)return true}}
 for(const[dirs,t]of[[D,'r'],[X,'b']]){const a=[];ray(b,sq,dirs,!by,a);for(const j of a){const q=b[j];if(q&&wh(q)===by&&(q.toLowerCase()===t||q.toLowerCase()==='q'))return true}}
 return false}
function pseudo(s,side){const b=s.b,out=[];
 for(let i=0;i<64;i++){const p=b[i];if(!p||wh(p)!==side)continue;const t=p.toLowerCase(),r=i>>3,c=i&7,add=(to,f)=>out.push({f:i,t:to,x:f});
  if(t==='p'){const d=side?-1:1,st=side?6:1,one=i+d*8;
   if(!b[one]){add(one);if(r===st&&!b[one+d*8])add(one+d*8,'dbl')}
   for(const dc of[-1,1]){const nc=c+dc;if(nc<0||nc>7)continue;const to=(r+d)*8+nc;if(b[to]&&wh(b[to])!==side)add(to);else if(to===s.ep)add(to,'ep')}}
  else if(t==='n'){for(const o of N){const j=i+o;if(ok(i,j)&&(!b[j]||wh(b[j])!==side))add(j)}}
  else if(t==='k'){for(const o of KG){const j=i+o;if(j>=0&&j<64&&Math.abs((j&7)-c)<=1&&(!b[j]||wh(b[j])!==side))add(j)}
   const h=side?60:4;
   if(i===h&&!attacked(b,h,!side)){
    if(s.c.includes(side?'K':'k')&&!b[h+1]&&!b[h+2]&&!attacked(b,h+1,!side)&&!attacked(b,h+2,!side))add(h+2,'oo');
    if(s.c.includes(side?'Q':'q')&&!b[h-1]&&!b[h-2]&&!b[h-3]&&!attacked(b,h-1,!side)&&!attacked(b,h-2,!side))add(h-2,'ooo')}}
  else{const a=[];ray(b,i,t==='r'?D:t==='b'?X:[...D,...X],side,a);a.forEach(j=>add(j))}}
 return out}
function apply(s,m){const b=s.b.slice(),p=b[m.f],side=wh(p);b[m.t]=p;b[m.f]='';
 if(m.x==='ep')b[m.t+(side?8:-8)]='';
 if(p.toLowerCase()==='p'&&(m.t>>3)===(side?0:7))b[m.t]=side?'Q':'q';
 if(m.x==='oo'){b[m.t-1]=b[m.t+1];b[m.t+1]=''}
 if(m.x==='ooo'){b[m.t+1]=b[m.t-2];b[m.t-2]=''}
 let c=s.c;const R={0:'q',7:'k',56:'Q',63:'K',4:'kq',60:'KQ'};
 for(const q of[m.f,m.t])if(R[q])for(const ch of R[q])c=c.replace(ch,'');
 return{b,t:!s.t,c,ep:m.x==='dbl'?(m.f+m.t)/2:-1}}
const inCheck=(b,side)=>attacked(b,b.indexOf(side?'K':'k'),!side);
const legal=s=>pseudo(s,s.t).filter(m=>!inCheck(apply(s,m).b,s.t));

/* ---------- online ---------- */
const $=id=>document.getElementById(id);
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
let db,user,me,games=[],plist=[],names={},gid=null,sel=null,conn=true,LG=null,flip=false,arrows=false;
const N_=id=>id===me?'أنت':(names[id]||'لاعب');
async function loadNames(ids){const need=[...new Set(ids.filter(x=>x&&!names[x]))];if(!need.length)return;
 try{const ps=await user.profiles(need);for(const id of need)names[id]=(ps[id]&&ps[id].name)||'لاعب'}catch(e){}render()}
async function boot(){
 try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
 conn=false;if(!db||!user){db=null;render();return}
 me=await user.id();
 db.collection('games').orderBy('ts','desc').limit(60).onSnapshot(s=>{games=s.docs.map(d=>({id:d.id,...d.data()}));loadNames(games.flatMap(g=>[g.w,g.b]));render()},()=>{});
 db.collection('players').orderBy('r','desc').limit(20).onSnapshot(s=>{plist=s.docs.map(d=>({id:d.id,...d.data()}));loadNames(plist.map(p=>p.id));render()},()=>{});
 render()}
async function newGame(){const ref=db.collection('games').doc();
 await ref.set({w:me,b:'',bd:START,t:'w',c:'KQkq',ep:-1,last:null,st:'open',res:'',ts:Date.now()});gid=ref.id;sel=null;render()}
async function join(id){await db.doc('games/'+id).update({b:me,st:'play'});gid=id;sel=null;render()}
async function pl(id){const s=await db.doc('players/'+id).get();return s.exists?s.data():{r:1200,w:0,l:0,d:0}}
async function rate(w,b,res){const A=await pl(w),B=await pl(b);
 const sa=res==='w'?1:res==='b'?0:.5,ea=1/(1+Math.pow(10,(B.r-A.r)/400));
 const na=Math.round(A.r+32*(sa-ea)),nb=Math.round(B.r+32*((1-sa)-(1-ea)));
 const up=(P,r,s)=>({r,w:P.w+(s===1?1:0),l:P.l+(s===0?1:0),d:P.d+(s===.5?1:0)});
 await db.doc('players/'+w).set(up(A,na,sa));await db.doc('players/'+b).set(up(B,nb,1-sa===.5?.5:1-sa))}
const toS=g=>({b:g.bd.split('').map(x=>x==='.'?'':x),t:g.t==='w',c:g.c||'',ep:g.ep});
async function move(g,m){const S=toS(g),n=apply(S,m);let res='';
 if(!legal(n).length)res=inCheck(n.b,n.t)?(n.t?'b':'w'):'d';
 await db.doc('games/'+g.id).update({bd:n.b.map(x=>x||'.').join(''),t:n.t?'w':'b',c:n.c,ep:n.ep,last:{f:m.f,t:m.t},st:res?'done':'play',res});
 if(res)await rate(g.w,g.b,res)}
async function resign(g,col){const res=col==='w'?'b':'w';
 await db.doc('games/'+g.id).update({st:'done',res});await rate(g.w,g.b,res)}

function render(){if(LG){localView();return}const g=gid&&games.find(x=>x.id===gid);if(gid&&!g){const v=$('v');v.replaceChildren(h('div','card','جاري التحميل...'));return}
 g?gameView(g):lobby()}
function lobby(){const v=$('v');v.replaceChildren();offCards(v);if(!db){v.append(h('div','card muted',conn?'جاري الاتصال بالأونلاين...':'الأونلاين محتاج تسجيل دخول بحساب Claude. الأوفلاين شغال عادي.'));return}
 const mine=plist.find(p=>p.id===me)||{r:1200,w:0,l:0,d:0};
 const c0=h('div','card');c0.append(h('h2',null,'تقييمك: '+mine.r),h('div','muted','فوز '+mine.w+' · خسارة '+mine.l+' · تعادل '+mine.d));
 const nb=h('button','big','＋ إنشاء لعبة جديدة');nb.onclick=newGame;c0.append(nb);v.append(c0);
 const act=games.filter(g=>g.st!=='done'&&(g.w===me||g.b===me));
 if(act.length){const c=h('div','card');c.append(h('h2',null,'ألعابك'));
  for(const g of act){const r=h('div','row');r.append(h('span',null,N_(g.w)+' ضد '+(g.b?N_(g.b):'...')));const b=h('button',null,'كمّل');b.onclick=()=>{gid=g.id;sel=null;render()};r.append(b);c.append(r)}v.append(c)}
 const op=games.filter(g=>g.st==='open'&&g.w!==me);
 const c1=h('div','card');c1.append(h('h2',null,'ألعاب مفتوحة'));
 if(!op.length)c1.append(h('div','muted','مفيش ألعاب مفتوحة دلوقتي'));
 for(const g of op){const r=h('div','row');r.append(h('span',null,N_(g.w)));const b=h('button',null,'انضم');b.onclick=()=>join(g.id);r.append(b);c1.append(r)}
 v.append(c1);
 const c2=h('div','card');c2.append(h('h2',null,'🏆 لوحة التقييم'));
 if(!plist.length)c2.append(h('div','muted','لسه محدش لعب'));
 plist.forEach((p,i)=>{const r=h('div','row'+(p.id===me?' me':''));r.append(h('span',null,(i+1)+'. '+N_(p.id)),h('span',null,p.r+'  ('+p.w+'-'+p.l+'-'+p.d+')'));c2.append(r)});
 v.append(c2)}
function gameView(g){const v=$('v');v.replaceChildren();
 const col=g.w===me?'w':g.b===me?'b':null,S=toS(g),over=g.st==='done',turnMine=col&&g.st==='play'&&(g.t==='w')===(col==='w');
 const ms=g.st==='play'?legal(S):[];if(sel!==null&&!(S.b[sel]&&turnMine&&wh(S.b[sel])===(col==='w')))sel=null;
 const mv=sel===null?[]:ms.filter(m=>m.f===sel),chk=g.st!=='open'&&inCheck(S.b,S.t),ki=S.b.indexOf(S.t?'K':'k');
 const top=h('div','row');const back=h('button','g','← رجوع');back.onclick=()=>{gid=null;sel=null;render()};
 top.append(back,h('span','muted',N_(g.w)+' ⚪ ضد ⚫ '+(g.b?N_(g.b):'...')));v.append(top);
 let t;if(g.st==='open')t='مستني لاعب ينضم...';
 else if(over)t=g.res==='d'?'تعادل':'فاز '+(g.res==='w'?'⚪ ':'⚫ ')+N_(g.res==='w'?g.w:g.b)+(chk?' (كش مات)':'');
 else t=(chk?'كش! ':'')+(turnMine?'دورك':'الدور على '+(g.t==='w'?'⚪':'⚫'));
 const stEl=h('div',null,t);stEl.id='st';v.append(stEl);
 const bd=h('div');bd.id='bd';const fl=(col==='b')!==flip;
 for(let k=0;k<64;k++){const i=fl?63-k:k,e=h('div','sq '+(((i>>3)+(i&7))%2?'d':'l')),p=S.b[i];
  if(g.last&&(i===g.last.f||i===g.last.t))e.classList.add('last');
  if(chk&&i===ki)e.classList.add('chk');
  if(i===sel)e.classList.add('sel');
  if(mv.some(m=>m.t===i))e.classList.add(p?'cp':'mv');
  if(p){const s=h('span',wh(p)?'w':'b',G[p.toLowerCase()]+'\uFE0E');e.append(s)}
  e.onclick=()=>{if(!turnMine)return;const m=mv.find(x=>x.t===i);if(m){sel=null;move(g,m);return}
   const q=S.b[i];sel=(q&&wh(q)===(col==='w'))?i:null;render()};
  bd.append(e)}
 v.append(bd);{const fb=h('button','g','⇅ قلب اللوحة'),fr=h('div','bar');fb.onclick=()=>{flip=!flip;render()};fr.append(fb);v.append(fr)}
 if(col&&g.st==='play'){const bar=h('div','bar');const rb=h('button','g','استسلام');rb.onclick=()=>{if(confirm('متأكد إنك عايز تستسلم؟'))resign(g,col)};bar.append(rb);v.append(bar)}
 if(!col&&g.st==='open'){const bar=h('div','bar');const jb=h('button',null,'انضم للعبة');jb.onclick=()=>join(g.id);bar.append(jb);v.append(bar)}}
/* ---------- offline / bots / engine ---------- */
const RT=[100,400,700,1000,1200,1300,1500,1800,2000,2200,2500];
let dl=0,nodes=0;
function save(){try{localStorage.setItem('tc',JSON.stringify({flip,arrows}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem('tc')||'{}');flip=!!o.flip;arrows=!!o.arrows}catch(e){}}
function ev(s){let v=0;for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const t=p.toLowerCase(),r=i>>3,c=i&7;
 let x=V[t]+(t==='p'||t==='n'?(3.5-Math.abs(3.5-c))*4+(3.5-Math.abs(3.5-r))*3:0);
